openapi: 3.0.3
info:
  title: Mr Money AI API
  version: 0.2.0
  description: Enterprise-grade document intelligence platform API.
servers:
  - url: http://127.0.0.1:8765
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service health
  /api/capabilities:
    get:
      summary: Supported formats, agents, and features
      responses:
        "200":
          description: Capabilities payload
  /api/auth/register:
    post:
      summary: Register a new user and organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
                organizationName:
                  type: string
      responses:
        "201":
          description: Registration successful
        "400":
          description: Validation error
  /api/auth/login:
    post:
      summary: Authenticate and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, orgId]
              properties:
                email:
                  type: string
                password:
                  type: string
                orgId:
                  type: string
      responses:
        "200":
          description: Authentication tokens
        "401":
          description: Invalid credentials
  /api/auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New access token
        "401":
          description: Invalid refresh token
  /api/auth/me:
    get:
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
        "401":
          description: Not authenticated
  /api/documents:
    get:
      summary: List documents
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Document list
    post:
      summary: Create a new document
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                workspaceId:
                  type: string
      responses:
        "201":
          description: Document created
  /api/documents/{documentId}/versions:
    get:
      summary: List document versions
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version list
  /api/documents/{documentId}/reviews:
    post:
      summary: Create a review for a document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                contentType:
                  type: string
                content:
                  type: string
                contentBase64:
                  type: string
      responses:
        "201":
          description: Review report
  /api/documents/{documentId}/comments:
    get:
      summary: List comments on a document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comment list
    post:
      summary: Add a comment to a document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                spanStart:
                  type: integer
                spanEnd:
                  type: integer
      responses:
        "201":
          description: Comment created
  /api/workspaces:
    get:
      summary: List workspaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspace list
    post:
      summary: Create a workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Workspace created
  /api/reviews:
    post:
      summary: Create a document review (standalone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                contentType:
                  type: string
                content:
                  type: string
                contentBase64:
                  type: string
      responses:
        "201":
          description: Review report
        "400":
          description: Invalid request
  /api/reviews/{reviewId}:
    get:
      summary: Retrieve a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review report
        "404":
          description: Review not found
  /api/reviews/{reviewId}/reports/{format}:
    get:
      summary: Export a review report
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [json, md, html, docx, pdf]
      responses:
        "200":
          description: Downloadable report
        "404":
          description: Review not found
  /api/compare:
    post:
      summary: Compare two documents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldText:
                  type: string
                newText:
                  type: string
      responses:
        "200":
          description: Comparison result
  /api/audit-logs:
    get:
      summary: List audit logs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Audit log list
        "403":
          description: Insufficient permissions
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
