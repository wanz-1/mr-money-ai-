openapi: 3.0.3
info:
  title: Mr Money AI API
  version: 0.4.0
  description: Enterprise-grade AI document intelligence platform with review agents, compliance, knowledge base, style guides, webhooks, and batch processing.
servers:
  - url: http://127.0.0.1:8765
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service health
  /api/capabilities:
    get:
      summary: Supported formats, agents, and features
      responses:
        "200":
          description: Capabilities payload
  /api/auth/register:
    post:
      summary: Register a new user and organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email:
                  type: string
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
                organizationName:
                  type: string
      responses:
        "201":
          description: Registration successful
        "400":
          description: Validation error
  /api/auth/login:
    post:
      summary: Authenticate and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, orgId]
              properties:
                email:
                  type: string
                password:
                  type: string
                orgId:
                  type: string
      responses:
        "200":
          description: Authentication tokens
        "401":
          description: Invalid credentials
  /api/auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New access token
        "401":
          description: Invalid refresh token
  /api/auth/me:
    get:
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
        "401":
          description: Not authenticated
  /api/documents:
    get:
      summary: List documents
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Document list
    post:
      summary: Create a new document
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                workspaceId:
                  type: string
      responses:
        "201":
          description: Document created
  /api/documents/{documentId}/versions:
    get:
      summary: List document versions
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version list
  /api/documents/{documentId}/reviews:
    post:
      summary: Create a review for a document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                contentType:
                  type: string
                content:
                  type: string
                contentBase64:
                  type: string
      responses:
        "201":
          description: Review report
  /api/documents/{documentId}/comments:
    get:
      summary: List comments on a document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comment list
    post:
      summary: Add a comment to a document
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                spanStart:
                  type: integer
                spanEnd:
                  type: integer
      responses:
        "201":
          description: Comment created
  /api/workspaces:
    get:
      summary: List workspaces
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspace list
    post:
      summary: Create a workspace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Workspace created
  /api/reviews:
    post:
      summary: Create a document review (standalone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filename:
                  type: string
                contentType:
                  type: string
                content:
                  type: string
                contentBase64:
                  type: string
      responses:
        "201":
          description: Review report
        "400":
          description: Invalid request
  /api/reviews/{reviewId}:
    get:
      summary: Retrieve a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review report
        "404":
          description: Review not found
  /api/reviews/{reviewId}/reports/{format}:
    get:
      summary: Export a review report
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [json, md, html, docx, pdf]
      responses:
        "200":
          description: Downloadable report
        "404":
          description: Review not found
  /api/compare:
    post:
      summary: Compare two documents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldText:
                  type: string
                newText:
                  type: string
      responses:
        "200":
          description: Comparison result
  /api/audit-logs:
    get:
      summary: List audit logs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Audit log list
        "403":
          description: Insufficient permissions
  /api/webhooks:
    get:
      summary: List webhook subscriptions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Webhook list
    post:
      summary: Create webhook subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Webhook created
  /api/webhooks/{id}:
    delete:
      summary: Delete webhook subscription
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /api/api-keys:
    get:
      summary: List API keys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key list
    post:
      summary: Create API key
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: API key created (key shown once)
  /api/api-keys/{id}:
    delete:
      summary: Delete API key
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /api/knowledge-base:
    get:
      summary: List knowledge base entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Entry list
    post:
      summary: Create knowledge base entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                sourceUri:
                  type: string
                contentHash:
                  type: string
      responses:
        "201":
          description: Entry created
  /api/knowledge-base/{id}:
    put:
      summary: Update knowledge base entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                contentHash:
                  type: string
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete knowledge base entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /api/style-guide:
    get:
      summary: List style guide terms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Term list
    post:
      summary: Create style guide term
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term]
              properties:
                term:
                  type: string
                preferredTerm:
                  type: string
                rule:
                  type: string
                severity:
                  type: string
      responses:
        "201":
          description: Term created
  /api/style-guide/{id}:
    put:
      summary: Update style guide term
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                preferredTerm:
                  type: string
                rule:
                  type: string
                severity:
                  type: string
      responses:
        "200":
          description: Updated
    delete:
      summary: Delete style guide term
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /api/citations:
    get:
      summary: List citations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Citation list
    post:
      summary: Create citation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                authors:
                  type: array
                  items:
                    type: string
                source:
                  type: string
                url:
                  type: string
                doi:
                  type: string
                year:
                  type: integer
      responses:
        "201":
          description: Citation created
  /api/citations/{id}:
    delete:
      summary: Delete citation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /api/integrations:
    get:
      summary: List integration connections
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Integration list
    post:
      summary: Create integration connection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, name]
              properties:
                provider:
                  type: string
                name:
                  type: string
                config:
                  type: object
      responses:
        "201":
          description: Integration created
  /api/integrations/{id}:
    delete:
      summary: Delete integration connection
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
  /api/batch:
    post:
      summary: Batch review multiple documents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  items:
                    type: object
                    properties:
                      content:
                        type: string
                      filename:
                        type: string
      responses:
        "201":
          description: Batch results
  /api/metrics:
    get:
      summary: Server metrics and health
      responses:
        "200":
          description: Metrics payload
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
