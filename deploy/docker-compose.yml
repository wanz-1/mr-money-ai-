services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8765:8765"
    env_file:
      - ../.env
    environment:
      - HP_HOST=0.0.0.0
      - HP_PORT=8765
      - DATABASE_URL=postgresql://mrmoney:${POSTGRES_PASSWORD:-mrmoney_secret}@db:5432/mrmoney
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mrmoney
      POSTGRES_USER: mrmoney
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrmoney_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrmoney"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
